<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sleep Monitor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0B1120;
      --panel: #131B2E;
      --panel-edge: #1F2A44;
      --text: #E5E9F0;
      --muted: #7C8AA3;
      --teal: #2DD4BF;
      --amber: #F5A524;
      --red: #EF4444;
    }

    * { box-sizing: border-box; }

    html {
      height: 100%;
      overscroll-behavior: none;
    }

    body {
      margin: 0;
      font-family: 'Inter', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100%;
      overflow-y: auto;
      overscroll-behavior: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: clamp(16px, 2vh, 32px) clamp(10px, 3vw, 20px) clamp(24px, 4vh, 60px);
      position: relative;
    }

    #bgVideo {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -2;
    }

    #bgOverlay {
      position: fixed;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(circle at 50% 35%, rgba(11,17,32,0.55), rgba(11,17,32,0.88) 70%),
        linear-gradient(rgba(11,17,32,0.35), rgba(11,17,32,0.65));
    }

    .content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 880px;
      gap: clamp(2px, 0.8vh, 8px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 0;
      flex-shrink: 0;
    }

    #logo { display: block; width: clamp(28px, 6vw, 36px); height: clamp(28px, 6vw, 36px); object-fit: contain; border-radius: 8px; }

    .brand h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(18px, 4.5vw, 22px);
      font-weight: 700;
      margin: 0;
      letter-spacing: -0.02em;
    }

    .eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(9px, 2.2vw, 11px);
      letter-spacing: 0.12em;
      color: var(--teal);
      text-transform: uppercase;
      margin: 0 0 clamp(4px, 1vh, 10px);
      flex-shrink: 0;
      text-align: center;
    }

    p.tagline {
      color: var(--muted);
      margin: 0 0 clamp(8px, 1.5vh, 18px);
      font-size: clamp(11px, 2.8vw, 14px);
      flex-shrink: 0;
      text-align: center;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--panel-edge);
      border-radius: clamp(10px, 2vw, 16px);
      padding: clamp(10px, 2vh, 24px);
      width: 100%;
      box-shadow: 0 20px 60px -30px rgba(0,0,0,0.6);
    }

    .video-wrap {
      position: relative;
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      background: #000;
      border-radius: clamp(8px, 1.5vw, 12px);
      overflow: hidden;
      aspect-ratio: 4 / 3;
      border: 1px solid var(--panel-edge);
    }

    video, img#output {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    video#video { display: none; }

    #idleVideo {
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    img#output {
      position: relative;
      z-index: 2;
    }

    img#output:not([src]), img#output[src=""] {
      background: transparent;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: clamp(8px, 2vw, 14px);
      margin-top: clamp(8px, 1.5vh, 14px);
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    .pulse-dot {
      position: relative;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--teal);
      flex-shrink: 0;
    }
    .pulse-dot::before {
      content: '';
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      background: var(--teal);
      opacity: 0.35;
      animation: pulse-calm 2.4s ease-out infinite;
    }
    .pulse-dot.yellow { background: var(--amber); }
    .pulse-dot.yellow::before { background: var(--amber); animation: pulse-warn 1.3s ease-out infinite; }
    .pulse-dot.red { background: var(--red); }
    .pulse-dot.red::before { background: var(--red); animation: pulse-alert 0.6s ease-out infinite; }

    @keyframes pulse-calm {
      0% { transform: scale(0.6); opacity: 0.35; }
      100% { transform: scale(2.2); opacity: 0; }
    }
    @keyframes pulse-warn {
      0% { transform: scale(0.6); opacity: 0.45; }
      100% { transform: scale(2.4); opacity: 0; }
    }
    @keyframes pulse-alert {
      0% { transform: scale(0.6); opacity: 0.6; }
      100% { transform: scale(2.6); opacity: 0; }
    }

    #statusBadge {
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(11px, 2.8vw, 13px);
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--text);
    }

    .controls {
      display: flex;
      gap: clamp(8px, 2vw, 12px);
      flex-wrap: wrap;
      margin-top: clamp(10px, 1.5vh, 16px);
      flex-shrink: 0;
    }

    button {
      background: var(--teal);
      color: #06201c;
      border: none;
      padding: clamp(8px, 1.4vh, 12px) clamp(14px, 3vw, 22px);
      border-radius: 10px;
      cursor: pointer;
      font-size: clamp(12px, 2.8vw, 14px);
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    button:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 8px 20px -8px rgba(45,212,191,0.5); }
    button:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
    button:disabled { opacity: 0.35; cursor: not-allowed; }
    button.secondary { background: transparent; color: var(--text); border: 1px solid var(--panel-edge); }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: clamp(6px, 1.2vh, 12px);
      margin-top: clamp(8px, 1.5vh, 16px);
      flex-shrink: 0;
    }

    .stat {
      background: var(--bg);
      border: 1px solid var(--panel-edge);
      border-radius: 10px;
      padding: clamp(8px, 1.4vh, 14px) clamp(8px, 2vw, 16px);
    }
    .stat label {
      display: block;
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(8px, 2vw, 10px);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: clamp(2px, 0.5vh, 6px);
    }
    .stat span {
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(15px, 3.8vw, 22px);
      font-weight: 600;
      color: var(--text);
    }

    .badge {
      display: none; /* legacy class kept for JS compatibility, visuals now driven by pulse-dot */
    }

    .note {
      margin-top: clamp(8px, 1.2vh, 14px);
      font-size: clamp(10px, 2.4vw, 12.5px);
      color: var(--muted);
      line-height: 1.4;
      border-top: 1px solid var(--panel-edge);
      padding-top: clamp(8px, 1.2vh, 12px);
      flex-shrink: 0;
    }

    .footer-credit {
      margin-top: clamp(16px, 3vh, 28px);
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      letter-spacing: 0.04em;
      color: var(--muted);
      opacity: 0.7;
      text-align: center;
    }
    .footer-credit strong {
      color: var(--teal);
      font-weight: 600;
    }

    #reportBox {
      flex-shrink: 0;
    }

    @media (max-height: 680px) {
      .eyebrow { margin-bottom: 2px; }
      p.tagline { margin-bottom: 6px; }
    }

    @media (max-width: 400px) {
      .controls button { flex: 1; text-align: center; min-width: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .pulse-dot::before { animation: none; }
    }

    #bootOverlay {
      position: fixed;
      inset: 0;
      z-index: 999;
      background:
        radial-gradient(circle at 50% 45%, rgba(45,212,191,0.08), transparent 55%),
        rgba(6,10,20,0.96);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      cursor: pointer;
      text-align: center;
      padding: 20px;
      overflow: hidden;
    }

    /* Faint tech grid backdrop */
    #bootOverlay::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(45,212,191,0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(45,212,191,0.06) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: radial-gradient(circle at 50% 45%, black 0%, transparent 70%);
      pointer-events: none;
    }

    /* Horizontal scanline sweeping down the screen */
    #bootOverlay::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--teal), transparent);
      opacity: 0.6;
      animation: boot-scanline 3.2s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes boot-scanline {
      0%   { top: 8%; opacity: 0; }
      10%  { opacity: 0.7; }
      90%  { opacity: 0.7; }
      100% { top: 92%; opacity: 0; }
    }

    #bootOverlay .hud-core {
      position: relative;
      width: 120px;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #bootOverlay .hud-ring {
      position: absolute;
      border-radius: 50%;
      border-style: solid;
      border-color: var(--teal) transparent var(--teal) transparent;
    }
    #bootOverlay .hud-ring.r1 {
      inset: 0;
      border-width: 2px;
      animation: boot-spin 4s linear infinite;
    }
    #bootOverlay .hud-ring.r2 {
      inset: 14px;
      border-width: 1px;
      border-color: transparent var(--amber) transparent var(--amber);
      opacity: 0.7;
      animation: boot-spin-rev 6s linear infinite;
    }
    #bootOverlay .hud-ring.r3 {
      inset: 28px;
      border-width: 1px;
      border-style: dashed;
      border-color: var(--teal);
      opacity: 0.5;
      animation: boot-spin 9s linear infinite;
    }

    #bootOverlay .hud-core-dot {
      position: relative;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--teal);
      box-shadow: 0 0 12px 3px rgba(45,212,191,0.8);
      animation: boot-pulse-core 1.8s ease-in-out infinite;
    }

    @keyframes boot-spin {
      to { transform: rotate(360deg); }
    }
    @keyframes boot-spin-rev {
      to { transform: rotate(-360deg); }
    }
    @keyframes boot-pulse-core {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.35); opacity: 0.7; }
    }

    /* Corner targeting brackets around the whole overlay */
    #bootOverlay .hud-corner {
      position: absolute;
      width: 28px;
      height: 28px;
      border: 2px solid var(--teal);
      opacity: 0.55;
    }
    #bootOverlay .hud-corner.tl { top: 24px; left: 24px; border-right: none; border-bottom: none; }
    #bootOverlay .hud-corner.tr { top: 24px; right: 24px; border-left: none; border-bottom: none; }
    #bootOverlay .hud-corner.bl { bottom: 24px; left: 24px; border-right: none; border-top: none; }
    #bootOverlay .hud-corner.br { bottom: 24px; right: 24px; border-left: none; border-top: none; }

    #bootOverlay .hud-text-block {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    #bootOverlay h2 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 26px;
      font-weight: 700;
      margin: 0;
      letter-spacing: 0.15em;
      color: var(--text);
      text-shadow: 0 0 18px rgba(45,212,191,0.5);
    }

    #bootOverlay .hud-status-line {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.14em;
      color: var(--muted);
      text-transform: uppercase;
      margin: 0;
    }
    #bootOverlay .hud-status-line span {
      color: var(--teal);
    }

    #bootOverlay p.hud-prompt {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--teal);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin: 4px 0 0;
      animation: boot-blink 1.6s ease-in-out infinite;
    }
    @keyframes boot-blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
  </style>
</head>
<body>

  <div id="bootOverlay">
    <div class="hud-corner tl"></div>
    <div class="hud-corner tr"></div>
    <div class="hud-corner bl"></div>
    <div class="hud-corner br"></div>

    <div class="hud-core">
      <div class="hud-ring r1"></div>
      <div class="hud-ring r2"></div>
      <div class="hud-ring r3"></div>
      <div class="hud-core-dot"></div>
    </div>

    <div class="hud-text-block">
      <h2>ARGUS</h2>
      <p class="hud-status-line">System status: <span>standing by</span></p>
      <p class="hud-prompt">Tap to initialize</p>
    </div>
  </div>

  <audio id="introSound" src="/audio/intro.mp3" preload="auto"></audio>
  <audio id="robotSound" src="/audio/monitoring.mp3" preload="auto"></audio>

  <div class="content">
    <div class="brand">
      <h1>Argus</h1>
    </div>
    <p class="eyebrow">AI vigilance, your digital safety net</p>
    <p class="tagline">Allow camera access and click Start.</p>

    <div class="panel">
      <div class="video-wrap">
        <video id="idleVideo" autoplay muted loop playsinline>
          <source src="/video/animation.mp4" type="video/mp4">
        </video>
        <video id="video" autoplay playsinline muted></video>
        <img id="output">
      </div>

      <div class="status-row">
        <span id="statusDot" class="pulse-dot green"></span>
        <div id="statusBadge" class="badge green">Status: Ready</div>
      </div>

      <div class="controls">
        <button id="startBtn">Start Monitoring</button>
        <button id="stopBtn" class="secondary" disabled>Stop</button>
      </div>

      <div id="reportBox" style="display:none; margin-top:16px;">
        <a id="reportLink" href="#" download="session_report.pdf" style="color:var(--teal); font-family:'JetBrains Mono',monospace; font-size:13px; text-decoration:none; border:1px solid var(--teal); padding:10px 16px; border-radius:8px; display:inline-block;">
          ↓ Download Session Report (PDF)
        </a>
      </div>

      <div class="stats">
        <div class="stat"><label>Session Time</label><span id="sessionTime">00:00</span></div>
        <div class="stat"><label>Sleep Events</label><span id="sleepEvents">0</span></div>
        <div class="stat"><label>Eyes Found</label><span id="eyesFound">0</span></div>
      </div>

    </div>

    <audio id="alertSound" src="/sleep-alert.mp3" loop preload="auto"></audio>

    <p class="footer-credit">Argus © 2026 — Built by <strong>Fahad</strong></p>
  </div>

  <script>
    const video = document.getElementById("video");
    const output = document.getElementById("output");
    const idleVideo = document.getElementById("idleVideo");
    const reportBox = document.getElementById("reportBox");
    const reportLink = document.getElementById("reportLink");
    const bootOverlay = document.getElementById("bootOverlay");
    const introSound = document.getElementById("introSound");
    const robotSound = document.getElementById("robotSound");
    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");
    const alertSound = document.getElementById("alertSound");
    const statusBadge = document.getElementById("statusBadge");
    const statusDot = document.getElementById("statusDot");
    let sessionId = null;
    let running = false;
    let detectTimer = null;
    const canvas = document.createElement("canvas");

    function setStatus(level) {
      const labels = {
        green: "Alert - Eyes Open",
        yellow: "Early Warning - Stay Alert",
        red: "Sleep ALERT! WAKE UP!"
      };
      const lvl = level || "green";
      statusBadge.textContent = "Status: " + (labels[lvl] || "Ready");
      statusBadge.className = "badge " + lvl;
      statusDot.className = "pulse-dot " + lvl;
    }

    function updateSound(shouldPlay) {
      if (shouldPlay) {
        alertSound.play().catch(() => {});
      } else {
        alertSound.pause();
        alertSound.currentTime = 0;
      }
    }

    async function detectFrame() {
      if (!running || video.readyState < 2) return;
      if (!video.videoWidth || !video.videoHeight) return; // video not ready yet, skip this tick

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(video, 0, 0);
      const imageData = canvas.toDataURL("image/jpeg", 0.7);

      try {
        const response = await fetch("/api/detect", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: sessionId, image: imageData })
        });

        if (!response.ok) return;
        const data = await response.json();

        sessionId = data.session_id;
        output.src = "data:image/jpeg;base64," + data.image;
        setStatus(data.alert_level);
        updateSound(data.play_sound);

        document.getElementById("sessionTime").textContent = data.session_time;
        document.getElementById("sleepEvents").textContent = data.sleep_events;
        document.getElementById("eyesFound").textContent = data.eyes_found;
      } catch (err) {
        console.error(err);
      }
    }

    const START_DELAY_MS = 3000; // adjust this to match your "monitoring" sound's length
    const SOUND_CLIP_MS = 3000;  // how long the robot sound plays before auto-stopping

    function playSoundClip(audioEl, durationMs) {
      audioEl.currentTime = 0;
      audioEl.play().catch(() => {});
      setTimeout(() => {
        audioEl.pause();
        audioEl.currentTime = 0;
      }, durationMs);
    }

    function startMonitoring() {
      startBtn.disabled = true;
      playSoundClip(robotSound, SOUND_CLIP_MS);
      setTimeout(beginCameraAccess, START_DELAY_MS);
    }

    async function beginCameraAccess() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } },
          audio: false
        });
        video.srcObject = stream;
        await video.play();
      } catch (err) {
        alert("Camera access denied or unavailable.");
        startBtn.disabled = false;
        return;
      }

      running = true;
      idleVideo.style.display = "none";
      reportBox.style.display = "none";
      stopBtn.disabled = false;
      detectTimer = setInterval(detectFrame, 150);
    }

    function stopMonitoring() {
      // Play the same sound on stop, like a session shut-down chime
      playSoundClip(robotSound, SOUND_CLIP_MS);

      running = false;
      clearInterval(detectTimer);
      updateSound(false);

      if (video.srcObject) {
        video.srcObject.getTracks().forEach(track => track.stop());
        video.srcObject = null;
      }

      if (sessionId) {
        fetch("/api/reset", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: sessionId })
        })
          .then(res => res.json())
          .then(data => {
            if (data.report_url) {
              reportLink.href = data.report_url;
              reportLink.download = data.report_url.split("/").pop();
              reportBox.style.display = "block";
            }
          })
          .catch(err => console.error(err));
        sessionId = null;
      }

      output.src = "";
      idleVideo.style.display = "block";
      startBtn.disabled = false;
      stopBtn.disabled = true;
      setStatus("green");
      statusBadge.textContent = "Status: Stopped";
    }

    startBtn.addEventListener("click", startMonitoring);
    stopBtn.addEventListener("click", stopMonitoring);

    bootOverlay.addEventListener("click", () => {
      introSound.play().catch(() => {});
      bootOverlay.style.opacity = "0";
      bootOverlay.style.transition = "opacity 0.5s ease";
      setTimeout(() => { bootOverlay.style.display = "none"; }, 500);
    }, { once: true });
  </script>
</body>
</html>
